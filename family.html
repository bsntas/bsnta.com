<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family — Basanta Sharma</title>
  <meta name="description" content="The Sharma and Poudyal family trees — the people at the heart of everything.">
  <meta name="author" content="Basanta Sharma (उन्मेशित)">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-slot"></div>

  <main>

    <header class="page-header">
      <div class="container">
        <p class="eyebrow">परिवार</p>
        <h1>Family</h1>
        <p>The Sharma family — the roots I grow from and the branches I tend.</p>
      </div>
    </header>

    <section class="section">
      <div class="container">

        <!-- ── Single unified tree (Sharma branch expands inline above Basanta) ── -->
        <div class="ftree-wrap">
          <div class="ftree">
            <ul>
              <li>

                <!-- Sharma expanded state (all three hidden by default) -->
                <div class="ft-branch-header" id="sharma-branch-header" hidden>
                  <h2 class="ftree-reveal-title">Sharma Family</h2>
                  <button type="button" class="ftree-reveal-close" id="sharmaClose">↓ Collapse</button>
                </div>

                <div class="ftcouple" id="sharma-parents-couple" hidden>
                  <button type="button" class="ftperson" id="muktinath"
                          data-note="Outspoken, commanding, and impossible to ignore in a room. He built everything we have — and made sure we all knew the standard he was building it to.">
                    <div class="ftavatar"><img src="assets/images/muktinath.jpg" alt="Muktinath Sharma"></div>
                    <div class="ftname">Muktinath Sharma</div>
                    <div class="ftrelation">Father</div>
                  </button>
                  <span class="ftheart" aria-hidden="true">♥</span>
                  <button type="button" class="ftperson"
                          data-note="Home is wherever she is. Her warmth has held this family together through every season, and no distance has ever made me feel far from her.">
                    <div class="ftavatar"><img src="assets/images/me_and_mom.jpg" alt="Sharada Sharma"></div>
                    <div class="ftname">Sharada Sharma</div>
                    <div class="ftrelation">Mother</div>
                  </button>
                </div>

                <!-- Siblings row: Sisir's branch + Basanta's branch side by side -->
                <ul id="sharma-siblings-ul" hidden>
                  <li>
                    <div class="ftcouple">
                      <button type="button" class="ftperson"
                              data-note="My first hero, my oldest friend. He paved the road ahead so I could walk it with more confidence than he ever had the luxury of.">
                        <div class="ftavatar"><img src="assets/images/sisir.jpg" alt="Sisir Sharma"></div>
                        <div class="ftname">Sisir Sharma</div>
                        <div class="ftrelation">Elder Brother</div>
                      </button>
                      <span class="ftheart" aria-hidden="true">♥</span>
                      <button type="button" class="ftperson"
                              data-note="The one who brought a gentler light into my brother's life — and into all of ours. She has been family from the very first day.">
                        <div class="ftavatar"><img src="assets/images/gomati.jpg" alt="Gomati Rai"></div>
                        <div class="ftname">Gomati Rai</div>
                        <div class="ftrelation">Sister-in-law</div>
                      </button>
                    </div>
                    <ul>
                      <li>
                        <button type="button" class="ftperson ftperson--child"
                                data-note="Curious, bright, and entirely herself. Watching her grow into her own person is one of the quiet joys I didn't know I needed.">
                          <div class="ftavatar"><img src="assets/images/devanshi.jpg" alt="Devanshi"></div>
                          <div class="ftname">Devanshi</div>
                          <div class="ftrelation">Niece</div>
                        </button>
                      </li>
                      <li>
                        <button type="button" class="ftperson ftperson--child"
                                data-note="She arrived and instantly doubled the noise and the laughter. May she always carry that spark.">
                          <div class="ftavatar"><img src="assets/images/shivanshi.jpg" alt="Shivanshi"></div>
                          <div class="ftname">Shivanshi</div>
                          <div class="ftrelation">Niece</div>
                        </button>
                      </li>
                    </ul>
                  </li>

                  <!-- Basanta's branch (Me) in the siblings row -->
                  <li>
                    <div class="ftcouple">
                      <button type="button" class="ftperson ftperson--you"
                              data-note="Still figuring it out — but grateful every day for the people who make that journey worthwhile.">
                        <div class="ftavatar"><img src="assets/images/me.jpg" alt="Basanta Sharma"></div>
                        <div class="ftname">Basanta Sharma</div>
                        <div class="ftrelation">That's Me</div>
                      </button>
                      <span class="ftheart" aria-hidden="true">♥</span>
                      <button type="button" class="ftperson ftperson--linked"
                              data-note="The person who makes ordinary days feel like something worth remembering. I can't imagine any version of this life without her in it."
                              data-linked-id="anisha-poudyal"
                              data-linked-label="Poudyal Family"
                              data-reveals="poudyal-section"
                              data-link-text="Anisha's family">
                        <div class="ftavatar"><img src="assets/images/anisha.jpg" alt="Anisha Sharma"></div>
                        <div class="ftname">Anisha Sharma</div>
                        <div class="ftrelation">Wife</div>
                      </button>
                    </div>
                    <ul>
                      <li>
                        <button type="button" class="ftperson ftperson--child"
                                data-note="He arrived and rearranged every priority I thought I had — entirely for the better. Fatherhood is his doing.">
                          <div class="ftavatar"><img src="assets/images/nirvighna.jpg" alt="Nirvighna Sharma"></div>
                          <div class="ftname">Nirvighna Sharma</div>
                          <div class="ftrelation">Son</div>
                        </button>
                      </li>
                      <li>
                        <button type="button" class="ftperson ftperson--expected"
                                data-note="A beautiful little soul on the way. 🌟">
                          <div class="ftavatar">✨</div>
                          <div class="ftname">Coming Soon</div>
                          <div class="ftrelation">Expected</div>
                        </button>
                      </li>
                    </ul>
                  </li>
                </ul><!-- #sharma-siblings-ul -->

                <!-- Core state: Basanta + Anisha as root (default; hidden when Sharma expanded) -->
                <div class="ftcouple" id="core-couple">
                  <button type="button" class="ftperson ftperson--you"
                          id="basanta-sharma"
                          data-note="Still figuring it out — but grateful every day for the people who make that journey worthwhile."
                          data-linked-id="muktinath"
                          data-linked-label="Sharma Family"
                          data-reveals="sharma-inline"
                          data-reveals-direction="up"
                          data-link-text="My parents &amp; siblings">
                    <div class="ftavatar"><img src="assets/images/me.jpg" alt="Basanta Sharma"></div>
                    <div class="ftname">Basanta Sharma</div>
                    <div class="ftrelation">That's Me</div>
                  </button>
                  <span class="ftheart" aria-hidden="true">♥</span>
                  <button type="button" class="ftperson ftperson--linked"
                          id="anisha-sharma"
                          data-note="The person who makes ordinary days feel like something worth remembering. I can't imagine any version of this life without her in it."
                          data-linked-id="anisha-poudyal"
                          data-linked-label="Poudyal Family"
                          data-reveals="poudyal-section"
                          data-link-text="Anisha's family">
                    <div class="ftavatar"><img src="assets/images/anisha.jpg" alt="Anisha Sharma"></div>
                    <div class="ftname">Anisha Sharma</div>
                    <div class="ftrelation">Wife</div>
                  </button>
                </div>

                <ul id="core-children-ul">
                  <li>
                    <button type="button" class="ftperson ftperson--child"
                            data-note="He arrived and rearranged every priority I thought I had — entirely for the better. Fatherhood is his doing.">
                      <div class="ftavatar"><img src="assets/images/nirvighna.jpg" alt="Nirvighna Sharma"></div>
                      <div class="ftname">Nirvighna Sharma</div>
                      <div class="ftrelation">Son</div>
                    </button>
                  </li>
                  <li>
                    <button type="button" class="ftperson ftperson--expected"
                            data-note="A beautiful little soul on the way. 🌟">
                      <div class="ftavatar">✨</div>
                      <div class="ftname">Coming Soon</div>
                      <div class="ftrelation">Expected</div>
                    </button>
                  </li>
                </ul>

              </li>
            </ul>
          </div>
        </div><!-- .ftree-wrap -->

        <!-- ── Poudyal Family Tree (hidden; revealed via Anisha's card) ── -->
        <div class="ftree-reveal-section" id="poudyal-section" aria-hidden="true">
          <div class="ftree-reveal-header">
            <p class="eyebrow">Anisha's Side</p>
            <h2 class="ftree-reveal-title">Poudyal Family</h2>
            <button type="button" class="ftree-reveal-close" id="poudyalClose">↑ Collapse</button>
          </div>
          <div class="ftree-wrap">
            <div class="ftree">
              <ul>
                <li>
                  <div class="ftcouple">
                    <button type="button" class="ftperson"
                            data-note="A pathfinder — someone who charts the course others don't yet see and moves toward it with quiet conviction. I'm grateful to have him as a second father.">
                      <div class="ftavatar"><img src="assets/images/lalit.jpg" alt="Lalit Poudyal"></div>
                      <div class="ftname">Lalit Poudyal</div>
                      <div class="ftrelation">Father</div>
                    </button>
                    <span class="ftheart" aria-hidden="true">♥</span>
                    <button type="button" class="ftperson"
                            data-note="Her warmth wraps around you the moment you walk through her door. She raised Anisha, and that alone tells you everything you need to know about her.">
                      <div class="ftavatar"><img src="assets/images/bindu.jpg" alt="Bindu Poudyal"></div>
                      <div class="ftname">Bindu Poudyal</div>
                      <div class="ftrelation">Mother</div>
                    </button>
                  </div>
                  <ul>
                    <li>
                      <button type="button" class="ftperson ftperson--linked"
                              id="anisha-poudyal"
                              data-note="The person who makes ordinary days feel like something worth remembering. I can't imagine any version of this life without her in it."
                              data-linked-id="anisha-sharma"
                              data-linked-label="Sharma Family">
                        <div class="ftavatar"><img src="assets/images/anisha.jpg" alt="Anisha Sharma"></div>
                        <div class="ftname">Anisha Sharma</div>
                        <div class="ftrelation">She's the one</div>
                      </button>
                    </li>
                    <li>
                      <button type="button" class="ftperson"
                              data-note="Spirited, full of life, and a constant reminder that the Poudyal family runs on warmth and energy.">
                        <div class="ftavatar"><img src="assets/images/akriti.jpg" alt="Akriti Poudyal"></div>
                        <div class="ftname">Akriti Poudyal</div>
                        <div class="ftrelation">Younger Sister</div>
                      </button>
                    </li>
                  </ul>
                </li>
              </ul>
            </div>
          </div>
        </div><!-- #poudyal-section -->

      </div>
    </section>

  </main>

  <dialog class="person-modal" id="personModal" aria-label="Person details">
    <button type="button" class="person-modal-close" id="personModalClose" aria-label="Close">&times;</button>
    <div class="person-modal-avatar" id="modalAvatar"></div>
    <div class="person-modal-name"     id="modalName"></div>
    <div class="person-modal-relation" id="modalRelation"></div>
    <div class="person-modal-note"     id="modalNote"></div>
    <div class="person-modal-link"     id="modalLink" hidden>
      <button type="button" class="person-modal-link-btn" id="modalLinkBtn"></button>
    </div>
  </dialog>

  <div id="footer-slot"></div>

  <script src="js/nav.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
